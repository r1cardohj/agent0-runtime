name: Release

# Push a tag like v0.1.0 from the main branch to test, build, and publish to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime
        run: python -m pip install --upgrade pip && python -m pip install -e ".[all]"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    name: build & verify
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = pyproject["project"]["version"]
          init = pathlib.Path("src/agent0_runtime/__init__.py").read_text()
          init_version = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)

          problems = []
          if tag != f"v{version}":
              problems.append(f"tag {tag!r} does not match pyproject version {version!r}")
          if init_version != version:
              problems.append(f"__version__ {init_version!r} != pyproject version {version!r}")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"releasing {tag} ({pyproject['project']['name']} {version})")
          PY
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Twine check
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent0-runtime
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
