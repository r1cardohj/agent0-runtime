[project]
name = "agent0-runtime"
version = "0.1.1"
description = "A small embeddable agent runtime with tools, sessions, events, and plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "r1cardohj", email = "2413302357@qq.com" },
]
keywords = [
    "agent",
    "agent-runtime",
    "llm",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.40.0",
]

[project.optional-dependencies]
# The model integration layer is always required; every other capability is
# opt-in so `pip install agent0-runtime` stays small for headless embedders.
images = ["pillow>=12.3.0"]
web = [
    "trafilatura>=2.3,<3",
    "urllib3>=2",
    "certifi>=2024",
]
all = [
    "pillow>=12.3.0",
    "trafilatura>=2.3,<3",
    "urllib3>=2",
    "certifi>=2024",
]

[project.urls]
Homepage = "https://github.com/r1cardohj/agent0-runtime"
Repository = "https://github.com/r1cardohj/agent0-runtime"
Issues = "https://github.com/r1cardohj/agent0-runtime/issues"
Changelog = "https://github.com/r1cardohj/agent0-runtime/blob/main/CHANGELOG.md"

[build-system]
# Hatchling 1.27 emits Metadata-Version 2.5, which current twine validators reject.
requires = ["hatchling>=1.24,<1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent0_runtime"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "ruff==0.12.12",
    "twine>=5",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "SIM",
    "ARG",
    "PLE",
    "PLW",
    "PLC",
    "I",
]
ignore = [
    "N",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLC0415",
]
